services:
  tiki-scraper:
    build: .
    container_name: tiki-scraper
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    volumes:
      # Mount debug folder agar bisa diakses dari host
      - ./debug:/app/debug
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
