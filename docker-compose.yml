services:
  tiki-scraper:
    build: .
    container_name: tiki-scraper
    restart: unless-stopped
    # Tanpa `ports:` — akses hanya lewat network internal (cloudflared tunnel
    # ke http://tiki-scraper:8000). Tidak ada port yang dipublish ke host.
    env_file:
      - .env
    volumes:
      # Mount debug folder agar bisa diakses dari host
      - ./debug:/app/debug
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('PORT','8000')+'/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Join ke network yang sudah dipakai service mysql + cloudflared.
# Pastikan network ini sudah ada (dibuat oleh stack mysql).
networks:
  app-network:
    name: app-network
    external: true
